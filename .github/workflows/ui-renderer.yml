name: UI / Renderer

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'renderer/**'
      - '!renderer/fresh-install.js'
      - 'core/browser-*.js'
      - 'assets/**'
      - 'scripts/smoke-renderer-foundation.cjs'
      - 'scripts/smoke-browser-workspace.cjs'
      - 'scripts/smoke-notifications.cjs'
      - '.github/workflows/ui-renderer.yml'
  push:
    branches: [main]
    paths:
      - 'renderer/**'
      - '!renderer/fresh-install.js'
      - 'core/browser-*.js'
      - 'assets/**'
      - 'scripts/smoke-renderer-foundation.cjs'
      - 'scripts/smoke-browser-workspace.cjs'
      - 'scripts/smoke-notifications.cjs'

permissions:
  contents: read

concurrency:
  group: ui-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ui:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Renderer syntax
        shell: bash
        run: |
          find renderer -maxdepth 1 -type f -name '*.js' -print0 | xargs -0 -n1 node --check
          node --check core/browser-workspace.js
          node --check core/browser-performance.js
      - name: UI regression suite
        run: |
          npm run test:renderer-foundation
          npm run test:browser
          npm run test:notifications