name: Test WordPress Bricks v6 contract

on:
  workflow_dispatch:
  push:
    paths:
      - 'CHATCODE-GPT/skills/wordpress-bricks/**'
      - 'core/bricks-project-detection.js'
      - 'core/bricks-skill-enforcer.js'
      - 'core/bricks-spec.js'
      - 'core/bricks-validator.js'
      - 'core/runtime-bootstrap.js'
      - 'scripts/smoke-wordpress-bricks-v6.cjs'
      - 'package.json'
      - '.github/workflows/test-wordpress-bricks-v6.yml'
  pull_request:
    paths:
      - 'CHATCODE-GPT/skills/wordpress-bricks/**'
      - 'core/bricks-project-detection.js'
      - 'core/bricks-skill-enforcer.js'
      - 'core/bricks-spec.js'
      - 'core/bricks-validator.js'
      - 'core/runtime-bootstrap.js'
      - 'scripts/smoke-wordpress-bricks-v6.cjs'
      - 'package.json'
      - '.github/workflows/test-wordpress-bricks-v6.yml'

permissions:
  contents: read

jobs:
  bricks-v6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Syntax check v6 enforcement and spec
        run: |
          node --check core/bricks-project-detection.js
          node --check core/bricks-skill-enforcer.js
          node --check core/bricks-spec.js
          node --check core/bricks-validator.js
          node --check core/runtime-bootstrap.js
          node --check scripts/smoke-wordpress-bricks-v6.cjs
      - name: Bricks 2.3.13 and mandatory task-bound regression
        run: node scripts/smoke-wordpress-bricks-v6.cjs
      - name: Existing WordPress Bricks regression suite
        run: npm run test:wordpress-bricks-skill
      - name: Existing Bricks spec regression suite
        run: npm run test:bricks-spec
