name: Patch Owner Affinity v150

on:
  push:
    branches:
      - feature/v1.0.50-multiproject-hardening
    paths:
      - '.github/workflows/patch-owner-affinity-v150.yml'

permissions:
  contents: write

jobs:
  patch-owner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0.50-multiproject-hardening
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply and verify target affinity
        run: |
          node scripts/patch-owner-affinity-v150.cjs
          node --check core/owner-resolver.js
          node scripts/smoke-owner-resolver.cjs
      - name: Commit runtime fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/owner-resolver.js
          git commit -m "fix: scope owner relations to task target"
          git push origin HEAD:feature/v1.0.50-multiproject-hardening
