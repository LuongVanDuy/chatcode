name: Core / Runtime

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'bootstrap-main.js'
      - 'main.js'
      - 'preload.js'
      - 'mcp-server.mjs'
      - 'core/**'
      - '!core/skill-*.js'
      - '!core/bricks-*.js'
      - '!core/wordpress*.js'
      - '!core/ui-knowledge.js'
      - '!core/builtin-skills-project.js'
      - '!core/browser-*.js'
      - 'tools/deploy-ftp.ps1'
      - 'scripts/smoke-mcp.mjs'
      - 'scripts/smoke-safety.cjs'
      - 'scripts/smoke-trusted.cjs'
      - 'scripts/smoke-terminal.cjs'
      - 'scripts/smoke-windows-terminal-guard.cjs'
      - 'scripts/smoke-patch-parser.cjs'
      - 'scripts/smoke-editing.cjs'
      - 'scripts/smoke-agent.cjs'
      - 'scripts/smoke-brain.cjs'
      - 'scripts/smoke-fastpath.cjs'
      - 'scripts/smoke-regression.cjs'
      - 'scripts/smoke-support.cjs'
      - 'scripts/smoke-notifications.cjs'
      - 'scripts/smoke-database-runtime.cjs'
      - 'scripts/smoke-machine-access.cjs'
      - 'scripts/smoke-ftp-deploy.cjs'
      - 'scripts/smoke-completion-deploy-policy.cjs'
      - '.github/workflows/core-runtime.yml'
  push:
    branches: [main]
    paths:
      - 'bootstrap-main.js'
      - 'main.js'
      - 'preload.js'
      - 'mcp-server.mjs'
      - 'core/**'
      - '!core/skill-*.js'
      - '!core/bricks-*.js'
      - '!core/wordpress*.js'
      - '!core/ui-knowledge.js'
      - '!core/builtin-skills-project.js'
      - '!core/browser-*.js'
      - 'tools/deploy-ftp.ps1'
      - 'scripts/smoke-mcp.mjs'
      - 'scripts/smoke-safety.cjs'
      - 'scripts/smoke-trusted.cjs'
      - 'scripts/smoke-terminal.cjs'
      - 'scripts/smoke-windows-terminal-guard.cjs'
      - 'scripts/smoke-patch-parser.cjs'
      - 'scripts/smoke-editing.cjs'
      - 'scripts/smoke-agent.cjs'
      - 'scripts/smoke-brain.cjs'
      - 'scripts/smoke-fastpath.cjs'
      - 'scripts/smoke-regression.cjs'
      - 'scripts/smoke-support.cjs'
      - 'scripts/smoke-notifications.cjs'
      - 'scripts/smoke-database-runtime.cjs'
      - 'scripts/smoke-machine-access.cjs'
      - 'scripts/smoke-ftp-deploy.cjs'
      - 'scripts/smoke-completion-deploy-policy.cjs'
      - '.github/workflows/core-runtime.yml'

permissions:
  contents: read

concurrency:
  group: core-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  core:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install
        run: npm install
      - name: Core regression suite
        shell: pwsh
        run: |
          npm run test:mcp
          npm run test:safety
          npm run test:trusted
          npm run test:terminal
          npm run test:editing
          npm run test:agent
          npm run test:brain
          npm run test:fastpath
          npm run test:regression
          npm run test:support
          npm run test:notifications
          npm run test:database
          npm run test:ftp-deploy

  cleanup-legacy-actions:
    if: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[cleanup-actions]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: write
      contents: read
    steps:
      - name: Remove legacy workflow runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          allowed='[".github/workflows/build-release.yml",".github/workflows/core-runtime.yml",".github/workflows/fresh-install.yml",".github/workflows/skills-wordpress-bricks.yml",".github/workflows/ui-renderer.yml"]'
          workflows=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows?per_page=100")
          echo "$workflows" | jq -c '.workflows[]' | while read -r wf; do
            id=$(echo "$wf" | jq -r '.id')
            name=$(echo "$wf" | jq -r '.name')
            path=$(echo "$wf" | jq -r '.path')
            if echo "$allowed" | jq -e --arg path "$path" 'index($path) != null' >/dev/null; then
              echo "KEEP: $name ($path)"
              continue
            fi

            echo "CLEAN: $name ($path)"
            while true; do
              runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/$id/runs?per_page=100" 2>/dev/null || true)
              if [ -z "$runs" ]; then
                echo "DONE: $name"
                break
              fi
              count=$(echo "$runs" | jq '.workflow_runs | length')
              if [ "$count" -eq 0 ]; then
                echo "DONE: $name"
                break
              fi
              echo "$runs" | jq -r '.workflow_runs[].id' | while read -r run_id; do
                gh api --method DELETE "repos/$GITHUB_REPOSITORY/actions/runs/$run_id" >/dev/null 2>&1 || true
              done
            done
          done