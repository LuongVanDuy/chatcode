name: Fresh Install Profile
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'core/fresh-install-*.js'
      - 'core/packages/**'
      - 'scripts/fresh-install-*'
      - '.github/workflows/fresh-install-profile.yml'
permissions:
  contents: read
jobs:
  vietnamese-bricks-profile:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_ROOT_PASSWORD: rootpass
          MARIADB_ROOT_HOST: '%'
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y php-cli php-mysql php-zip php-curl mariadb-client
      - name: Supplied child, Vietnamese login, clean extensions and one-DB reinstall
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_PORT: 3306
          MYSQL_ROOT_PASSWORD: rootpass
          PANEL_USER: tester
          PANEL_PASSWORD: 'FTP!a+b&c%5\d"e''f'
          PANEL_MAX_DATABASES: 1
        run: |
          export PANEL_AUDIT_FILE="$RUNNER_TEMP/profile-panel-audit.txt"
          SITE="$RUNNER_TEMP/chatcode-profile-site"
          CORE="$RUNNER_TEMP/profile-wordpress.zip"
          curl -fsSL --max-time 180 https://wordpress.org/latest.zip -o "$CORE"
          python3 scripts/fresh-install-e2e-fixtures.py prepare "$SITE"
          python3 scripts/fake-directadmin.py > "$RUNNER_TEMP/profile-panel.log" 2>&1 &
          PANEL_PID=$!
          trap 'kill "$PANEL_PID" || true' EXIT
          sleep 1
          node scripts/fresh-install-e2e-profile.cjs --live "$SITE" "$CORE"
