name: Patch v1.0.52

on:
  push:
    branches:
      - feature/v1.0.52
    paths:
      - 'scripts/fix-v1052-render.cjs'
      - '.github/workflows/patch-v1052.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0.52
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Repair renderer convention
        run: node scripts/fix-v1052-render.cjs
      - name: Verify renderer foundation and syntax
        run: |
          node --check renderer/v10-runtime.js
          node scripts/smoke-renderer-foundation.cjs
      - name: Commit renderer repair
        shell: bash
        run: |
          if git diff --quiet -- renderer/v10-runtime.js; then
            echo 'No renderer changes to commit'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add renderer/v10-runtime.js
          git commit -m 'fix: preserve workspace mode in-place refresh convention'
          git push origin HEAD:feature/v1.0.52
