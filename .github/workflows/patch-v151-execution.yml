name: Patch v151 Execution

on:
  push:
    branches:
      - feature/v1.0.51-unified-execution-db
    paths:
      - '.github/workflows/patch-v151-execution.yml'
      - 'scripts/patch-v151-execution.cjs'
      - 'scripts/patch-v151-agent.cjs'
      - 'scripts/smoke-task-planner.cjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0.51-unified-execution-db
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply execution-first policy
        run: |
          node scripts/patch-v151-execution.cjs
          node scripts/patch-v151-agent.cjs
          node --check core/task-planner.js
          node --check core/agent-runtime.js
      - name: Existing targeted regressions
        run: |
          node scripts/smoke-task-planner.cjs
          node scripts/smoke-agent.cjs
      - name: Commit policy patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/task-planner.js core/agent-runtime.js
          git commit -m "feat: make Bricks execution completion-first with bounded fallbacks"
          git push origin HEAD:feature/v1.0.51-unified-execution-db
