name: Patch v151 FTP Windows
# retry after structural report patch fix

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-v151-ftp-windows.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0.51-unified-execution-db
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Prepare narrow FTP owned-helper deletion
        run: node scripts/patch-v151-ftp-repair.cjs
      - name: Parse and run FTP Windows regression
        shell: pwsh
        run: |
          $null = [scriptblock]::Create((Get-Content -LiteralPath tools/deploy-ftp.ps1 -Raw))
          node scripts/smoke-ftp-runner.cjs
      - name: Commit FTP repair
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tools/deploy-ftp.ps1 scripts/smoke-ftp-runner.cjs
          git diff --cached --check
          git commit -m 'fix: restrict FTP cleanup to owned database helpers'
          git push origin HEAD:feature/v1.0.51-unified-execution-db
