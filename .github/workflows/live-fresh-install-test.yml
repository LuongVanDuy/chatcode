name: Live Fresh Install - thanhdofood
# retry-marker-2

on:
  push:
    branches:
      - live-test/thanhdofood-20260918
    paths:
      - '.github/workflows/live-fresh-install-test.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-fresh-install:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Generate one-time RSA key
        shell: pwsh
        run: |
          $rsa = [System.Security.Cryptography.RSA]::Create(4096)
          try {
            $private = [Convert]::ToBase64String($rsa.ExportPkcs8PrivateKey())
            $public = [Convert]::ToBase64String($rsa.ExportSubjectPublicKeyInfo())
            [IO.File]::WriteAllText((Join-Path $env:RUNNER_TEMP 'live-private-key.b64'), $private)
            Write-Host "CHATCODE_LIVE_PUBLIC_KEY_B64=$public"
            New-Item -ItemType Directory -Force -Path 'live-test' | Out-Null
            [IO.File]::WriteAllText((Join-Path (Get-Location) 'live-test/public-key.b64'), $public)
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add live-test/public-key.b64
            git commit -m 'test: publish ephemeral live-test public key'
            git push origin HEAD:$env:GITHUB_REF_NAME
            Write-Host 'Published ephemeral public key. Waiting for encrypted credential payload.'
          } finally {
            $rsa.Dispose()
          }

      - name: Wait for encrypted credentials
        shell: pwsh
        run: |
          $branch = $env:GITHUB_REF_NAME
          $target = Join-Path $env:RUNNER_TEMP 'credentials.rsa.b64'
          $refspec = '+refs/heads/' + $branch + ':refs/remotes/origin/' + $branch
          $filespec = 'refs/remotes/origin/' + $branch + ':live-test/credentials.rsa.b64'
          $found = $false
          for ($i = 0; $i -lt 120; $i++) {
            git fetch origin $refspec --quiet
            $payload = git show $filespec 2>$null
            if ($LASTEXITCODE -eq 0 -and -not [string]::IsNullOrWhiteSpace(($payload -join ''))) {
              [IO.File]::WriteAllText($target, (($payload -join '')).Trim())
              $found = $true
              break
            }
            Start-Sleep -Seconds 5
          }
          if (-not $found) { throw 'Encrypted credential payload did not arrive within 10 minutes.' }

      - name: Decrypt credentials in runner memory
        shell: pwsh
        run: |
          $rsa = [System.Security.Cryptography.RSA]::Create()
          try {
            $privateBytes = [Convert]::FromBase64String((Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'live-private-key.b64')).Trim())
            $read = 0
            $rsa.ImportPkcs8PrivateKey($privateBytes, [ref]$read)
            $cipher = [Convert]::FromBase64String((Get-Content -Raw (Join-Path $env:RUNNER_TEMP 'credentials.rsa.b64')).Trim())
            $plain = $rsa.Decrypt($cipher, [System.Security.Cryptography.RSAEncryptionPadding]::OaepSHA256)
            $credentialFile = Join-Path $env:RUNNER_TEMP 'live-credentials.json'
            [IO.File]::WriteAllBytes($credentialFile, $plain)
          } finally {
            $rsa.Dispose()
          }

          $cred = Get-Content -Raw $credentialFile | ConvertFrom-Json
          if ($cred.domain -ne 'thanhdofood.com') { throw 'Credential payload domain mismatch.' }
          if ([string]::IsNullOrWhiteSpace([string]$cred.username) -or [string]::IsNullOrWhiteSpace([string]$cred.password)) {
            throw 'Credential payload is incomplete.'
          }
          Write-Host "::add-mask::$($cred.username)"
          Write-Host "::add-mask::$($cred.password)"
          Write-Host 'Credentials decrypted and masked.'

      - name: Run production Fresh Install against live hosting
        shell: pwsh
        run: |
          node scripts/live-fresh-install-test.cjs (Join-Path $env:RUNNER_TEMP 'live-credentials.json')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload sanitized live-test result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: thanhdofood-live-fresh-install-result
          path: live-test-result.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Remove ephemeral secrets
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'live-private-key.b64')
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'credentials.rsa.b64')
          Remove-Item -Force -ErrorAction SilentlyContinue (Join-Path $env:RUNNER_TEMP 'live-credentials.json')