name: Fresh Install Database
on:
  workflow_call:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'core/fresh-install-*.js'
      - 'scripts/fresh-install-e2e-database.cjs'
      - '.github/workflows/fresh-install-database.yml'
  push:
    branches: [main]
    paths:
      - 'core/fresh-install-*.js'
      - 'scripts/fresh-install-e2e-database.cjs'
      - '.github/workflows/fresh-install-database.yml'
permissions:
  contents: read
jobs:
  database-errors:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update -qq && sudo apt-get install -y php-cli
      - name: PHP panel errors and non-destructive retry
        run: node scripts/fresh-install-e2e-database.cjs
