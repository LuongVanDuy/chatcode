name: Patch v151 Integration

on:
  push:
    branches:
      - feature/v1.0.51-unified-execution-db
    paths:
      - '.github/workflows/patch-v151-integration.yml'
      - 'scripts/patch-v151-integration.cjs'
      - 'scripts/patch-v151-mcp.cjs'
      - 'scripts/smoke-database-runtime.cjs'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0.51-unified-execution-db
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply database/MCP integration
        run: |
          # One-shot branch-only integrator; removed before merge.
          node scripts/patch-v151-integration.cjs
          node --check core/database-runtime.js
          node --check core/ftp-deploy.js
          node --check mcp-server.mjs
          node --check scripts/smoke-database-runtime.cjs
          node scripts/smoke-database-runtime.cjs
          node scripts/smoke-project-scope.cjs
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core/database-runtime.js core/ftp-deploy.js tools/deploy-ftp.ps1 mcp-server.mjs package.json .github/workflows/test-chatcode-gpt-skills.yml .github/workflows/test-wordpress-bricks-v6.yml .github/workflows/build-windows.yml
          git commit -m "feat: expose bounded server-side WordPress database capability"
          git push origin HEAD:feature/v1.0.51-unified-execution-db
