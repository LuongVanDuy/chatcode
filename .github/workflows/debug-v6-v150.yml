name: Debug Bricks v6 v150

on:
  push:
    branches:
      - feature/v1.0.50-multiproject-hardening
    paths:
      - 'core/bricks-skill-enforcer.js'
      - 'scripts/smoke-wordpress-bricks-v6.cjs'
      - '.github/workflows/debug-v6-v150.yml'

jobs:
  debug-v6:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Capture v6 smoke output
        shell: bash
        run: |
          set +e
          node scripts/smoke-wordpress-bricks-v6.cjs > v6-debug.txt 2>&1
          code=$?
          echo "$code" > v6-exit.txt
          cat v6-debug.txt
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: v6-debug
          path: |
            v6-debug.txt
            v6-exit.txt
      - name: Preserve smoke failure state
        shell: bash
        run: |
          code=$(cat v6-exit.txt)
          exit "$code"
