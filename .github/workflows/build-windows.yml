name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Kiểm tra cú pháp
        run: npm run test:syntax
      - name: Smoke test MCP protocol
        run: npm run test:mcp
      - name: Build Windows installer
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: chatcode-ca-nhan-windows
          path: dist/*.exe
      - name: Smoke test remote MCP tunnel
        run: npm run test:tunnel