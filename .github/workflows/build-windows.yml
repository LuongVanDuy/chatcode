name: Build Windows installer

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install
      - name: Kiểm tra cú pháp
        run: npm run test:syntax
      - name: Smoke test MCP protocol
        run: npm run test:mcp
      - name: Smoke test Safety & Recovery
        run: npm run test:safety
      - name: Smoke test Project Brain
        run: npm run test:brain
      - name: Smoke test WordPress Brain
        run: npm run test:wordpress
      - name: Smoke test fast coding path
        run: npm run test:fastpath
      - name: Regression test filesystem & Windows tasks
        run: npm run test:regression
      - name: Build Windows installer
        run: npm run dist:win
      - uses: actions/upload-artifact@v4
        with:
          name: chatcode-ca-nhan-windows
          path: dist/*.exe
      - name: Smoke test remote MCP tunnel
        run: npm run test:tunnel
      - name: Publish GitHub Release asset
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = $env:GITHUB_REF_NAME
          $asset = Get-ChildItem dist\*.exe | Select-Object -First 1
          if (-not $asset) { throw 'Không tìm thấy installer để publish.' }
          gh release view $tag *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset.FullName --clobber
          } else {
            gh release create $tag $asset.FullName --title "ChatCode Cá Nhân $tag" --generate-notes
          }
