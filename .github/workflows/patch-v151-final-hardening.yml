name: Patch v151 Final Hardening
# retry after checklist compaction

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/patch-v151-final-hardening.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0.51-unified-execution-db
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Patch explicit scope and Bricks database receipt guard
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'marker missing in {path}: {old[:120]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'marker not unique in {path}: {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          replace_once('core/task-planner.js',
              "      companions:(resolved.companion_paths || []).slice(0,3),\n      enforce_paths:(resolved.enforce_paths || []).slice(0,3),",
              "      companions:(explicitPaths.length ? [] : (resolved.companion_paths || [])).slice(0,3),\n      enforce_paths:(explicitPaths.length ? explicitPaths : (resolved.enforce_paths || [])).slice(0,3),")

          replace_once('core/runtime-bootstrap.js',
              "  // Final Bricks enforcement layer upgrades mandatory from project-level priming to\n  // task-bound receipts: inspect/read never authorize mutation; prepare_task does.\n  const { installBricksSkillEnforcerPatches } = require('./bricks-skill-enforcer');\n  installBricksSkillEnforcerPatches();\n  // Evidence hardening runs after the receipt enforcer so it can prove current-task\n  // Bricks element/media IDs, lint generated selectors, preflight PHP ownership and\n  // keep code/deploy/live verification states separate.\n  const { installBricksEvidencePatches } = require('./bricks-evidence');\n  installBricksEvidencePatches();\n  // Optional WordPress database capability: bounded server-side bridge/one-shot fallback.\n  // It is installed before Project Scope so every action inherits the same task/project lane.\n  const { installDatabaseRuntimePatches } = require('./database-runtime');\n  installDatabaseRuntimePatches();",
              "  // Optional WordPress database capability is installed before the Bricks receipt\n  // enforcer so database query/mutation paths cannot bypass task-bound skill policy.\n  const { installDatabaseRuntimePatches } = require('./database-runtime');\n  installDatabaseRuntimePatches();\n  // Final Bricks enforcement layer upgrades mandatory from project-level priming to\n  // task-bound receipts: inspect/read never authorize mutation; prepare_task does.\n  const { installBricksSkillEnforcerPatches } = require('./bricks-skill-enforcer');\n  installBricksSkillEnforcerPatches();\n  // Evidence hardening runs after the receipt enforcer so it can prove current-task\n  // Bricks element/media IDs, lint generated selectors, preflight PHP ownership and\n  // keep code/deploy/live verification states separate.\n  const { installBricksEvidencePatches } = require('./bricks-evidence');\n  installBricksEvidencePatches();")

          replace_once('core/bricks-skill-enforcer.js',
              "    'writeFile','deleteFile','renameFile','runTask','exec'",
              "    'writeFile','deleteFile','renameFile','runTask','exec','databaseOp'")

          db_wrapper = r'''
          if (original.databaseOp) {
            api.databaseOp = async (ref, input = {}) => {
              const action = String(input?.action || 'inspect').trim().toLowerCase();
              // Topology inspection is discovery only. Rollback remains recovery-safe; the
              // database runtime itself still validates the task/project-bound recovery point.
              if (isInternalComplete() || !modern || action === 'inspect' || action === 'rollback') {
                return original.databaseOp(ref,input);
              }
              const policy = await detect(ref);
              if (policy.active) {
                const taskId = String(input?.task_id || '');
                if (!receiptValid(taskId,ref)) required(ref,`database_${action}`,{
                  task_id:taskId,
                  reason:'database query/mutation on Bricks must be bound to the current prepared task receipt'
                });
              }
              return original.databaseOp(ref,input);
            };
          }

          '''
          replace_once('core/bricks-skill-enforcer.js',
              "  if (original.exec) {\n",
              db_wrapper + "  if (original.exec) {\n")

          replace_once('scripts/smoke-wordpress-bricks-v6.cjs',
              "  let writes = 0, patches = 0, execs = 0, completes = 0, rollbacks = 0;",
              "  let writes = 0, patches = 0, execs = 0, completes = 0, rollbacks = 0, databaseCalls = 0;")
          replace_once('scripts/smoke-wordpress-bricks-v6.cjs',
              "    async exec(){ execs++; return { status:'completed', exit_code:0 }; },\n    async finishWork(){ return { status:'completed' }; },",
              "    async exec(){ execs++; return { status:'completed', exit_code:0 }; },\n    async databaseOp(_ref,input){ databaseCalls++; return { ok:true, action:String(input?.action || 'inspect') }; },\n    async finishWork(){ return { status:'completed' }; },")
          replace_once('scripts/smoke-wordpress-bricks-v6.cjs',
              "  await assert.rejects(() => enforced.applyAndVerify('p1',[],[]), error => error?.code === 'BRICKS_SKILL_TASK_REQUIRED');\n\n  await enforced.rollbackWork('orphan-recovery');",
              "  await assert.rejects(() => enforced.applyAndVerify('p1',[],[]), error => error?.code === 'BRICKS_SKILL_TASK_REQUIRED');\n  await enforced.databaseOp('p1',{ action:'inspect' });\n  await assert.rejects(() => enforced.databaseOp('p1',{ action:'query', sql:'SELECT 1' }), error => error?.code === 'BRICKS_SKILL_TASK_REQUIRED');\n  await assert.rejects(() => enforced.databaseOp('p1',{ action:'mutate', task_id:'task-1', operation:'update_option', payload:{ key:'x', value:'y' } }), error => error?.code === 'BRICKS_SKILL_TASK_REQUIRED');\n  assert.equal(databaseCalls,1,'only read-only topology inspection may bypass a prepared Bricks receipt');\n\n  await enforced.rollbackWork('orphan-recovery');")
          replace_once('scripts/smoke-wordpress-bricks-v6.cjs',
              "  await enforced.exec('p1','php -l x.php',{ work_session_id:'task-1' });\n  assert.equal(patches,1);",
              "  await enforced.exec('p1','php -l x.php',{ work_session_id:'task-1' });\n  await enforced.databaseOp('p1',{ action:'query', task_id:'task-1', sql:'SELECT 1' });\n  await enforced.databaseOp('p1',{ action:'mutate', task_id:'task-1', operation:'update_option', payload:{ key:'x', value:'y' } });\n  await enforced.databaseOp('p1',{ action:'rollback', task_id:'task-1', recovery_id:'recovery-fixture' });\n  assert.equal(databaseCalls,4,'prepared query/mutate and recovery rollback must reach the database runtime');\n  assert.equal(patches,1);")
          PY
      - name: Targeted regression
        run: |
          node --check core/task-planner.js
          node --check core/runtime-bootstrap.js
          node --check core/bricks-skill-enforcer.js
          node --check scripts/smoke-wordpress-bricks-v6.cjs
          node scripts/smoke-owner-resolver.cjs
          node scripts/smoke-wordpress-bricks-v6.cjs
          npm run test:database
          npm run test:wordpress-bricks-skill
      - name: Commit runtime hardening
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/task-planner.js core/runtime-bootstrap.js core/bricks-skill-enforcer.js scripts/smoke-wordpress-bricks-v6.cjs
          git diff --cached --check
          git commit -m 'fix: bind Bricks database paths to task receipts'
          git push origin HEAD:feature/v1.0.51-unified-execution-db
