name: Patch v1.0.54 deploy finalization

on:
  push:
    branches: [feature/v1.0.54-deploy-finalization]
    paths:
      - 'scripts/patch-v1054.cjs'
      - '.github/workflows/patch-v1054.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0.54-deploy-finalization
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Apply patch
        run: node scripts/patch-v1054.cjs
      - name: Syntax + targeted regression
        run: |
          node --check core/work-runtime.js
          node --check core/ftp-deploy.js
          node --check core/project-scope.js
          node --check core/agent-runtime.js
          node --check scripts/smoke-ftp-deploy.cjs
          node scripts/smoke-ftp-deploy.cjs
          node scripts/smoke-completion-deploy-policy.cjs
          node scripts/smoke-agent.cjs
          node scripts/smoke-project-scope.cjs
          node scripts/smoke-wordpress-bricks-v6.cjs
      - name: Commit runtime changes
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/work-runtime.js core/ftp-deploy.js core/project-scope.js core/agent-runtime.js scripts/smoke-ftp-deploy.cjs package.json
          git commit -m 'fix: finalize work only after deploy succeeds'
          git push origin HEAD:feature/v1.0.54-deploy-finalization
