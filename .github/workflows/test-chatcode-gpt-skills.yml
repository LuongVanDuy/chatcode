name: Test ChatCode GPT skills

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'CHATCODE-GPT/**'
      - 'core/**'
      - 'renderer/**'
      - 'scripts/smoke-*.cjs'
      - 'scripts/smoke-*.mjs'
      - 'package.json'
      - '.github/workflows/test-chatcode-gpt-skills.yml'
  pull_request:
    branches: [main]
    paths:
      - 'CHATCODE-GPT/**'
      - 'core/**'
      - 'renderer/**'
      - 'scripts/smoke-*.cjs'
      - 'scripts/smoke-*.mjs'
      - 'package.json'
      - '.github/workflows/test-chatcode-gpt-skills.yml'

concurrency:
  group: skill-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  targeted:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Detect impacted groups
        id: scope
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            for key in planner agent skill bricks project desktop; do echo "$key=true" >> "$GITHUB_OUTPUT"; done
            echo "full=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA")"
          printf '%s\n' "$files"
          hit() { grep -Eiq "$1" <<< "$files"; }
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; }

          planner=false; agent=false; skill=false; bricks=false; project=false; desktop=false
          hit '^(core/(task-planner|owner-resolver|hard-project-rules|project-profile)\.js|scripts/smoke-(task-planner|fast-deep-routing|owner-resolver|hard-project-rules|functional-ownership)\.cjs)$' && planner=true
          hit '^(core/(agent-runtime|completion-deploy-policy|work-runtime|ftp-deploy|fast-execution)\.js|scripts/smoke-(agent|completion-deploy-policy|ftp-deploy|fast-execution)\.cjs)$' && agent=true
          hit '^(CHATCODE-GPT/|core/(skill-runtime|skill-policy|ui-knowledge)\.js|scripts/smoke-wordpress-bricks-(skill|builder-editability|focus-discipline)\.cjs)$' && skill=true
          hit '^(core/(bricks-spec|bricks-validator)\.js|scripts/smoke-bricks-spec\.cjs)$' && bricks=true
          hit '^(core/(project-scope|brain|brain-scope|wordpress-retrieval|retrieval-scope|wordpress)\.js|scripts/smoke-(project-scope|wordpress-brain-scope|wordpress-retrieval-scope|project-profile)\.cjs)$' && project=true
          hit '^(renderer/|core/updater\.js|scripts/smoke-(renderer-foundation|updater)\.cjs)$' && desktop=true

          # Shared runtime changes get the directly adjacent groups only; no historical benchmark or installer on PR.
          hit '^(core/(runtime-bootstrap|safety-tools|projects|store)\.js|package\.json|\.github/workflows/test-chatcode-gpt-skills\.yml)$' && planner=true && agent=true && project=true

          out planner "$planner"
          out agent "$agent"
          out skill "$skill"
          out bricks "$bricks"
          out project "$project"
          out desktop "$desktop"
          out full false

      - name: Syntax check changed source
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            files="$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -E '\.(js|cjs|mjs)$' || true)"
          else
            files="$(git ls-files '*.js' '*.cjs' '*.mjs')"
          fi
          while IFS= read -r file; do
            [[ -z "$file" ]] && continue
            node --check "$file"
          done <<< "$files"

      - name: Planner and ownership regressions
        if: ${{ steps.scope.outputs.planner == 'true' }}
        run: |
          node scripts/smoke-owner-resolver.cjs
          node scripts/smoke-task-planner.cjs
          node scripts/smoke-fast-deep-routing.cjs
          node scripts/smoke-hard-project-rules.cjs
          node scripts/smoke-functional-ownership.cjs

      - name: Fast Agent and bounded completion regressions
        if: ${{ steps.scope.outputs.agent == 'true' }}
        run: |
          node scripts/smoke-agent.cjs
          node scripts/smoke-completion-deploy-policy.cjs

      - name: WordPress Bricks skill regressions
        if: ${{ steps.scope.outputs.skill == 'true' }}
        run: |
          node scripts/smoke-wordpress-bricks-skill.cjs
          node scripts/smoke-wordpress-bricks-builder-editability.cjs
          node scripts/smoke-wordpress-bricks-focus-discipline.cjs

      - name: Bricks spec regressions
        if: ${{ steps.scope.outputs.bricks == 'true' }}
        run: node scripts/smoke-bricks-spec.cjs

      - name: Project scope and retrieval regressions
        if: ${{ steps.scope.outputs.project == 'true' }}
        run: |
          node scripts/smoke-project-profile.cjs
          node scripts/smoke-wordpress-brain-scope.cjs
          node scripts/smoke-wordpress-retrieval-scope.cjs
          node scripts/smoke-project-scope.cjs

      - name: Desktop and updater regressions
        if: ${{ steps.scope.outputs.desktop == 'true' }}
        run: |
          node scripts/smoke-renderer-foundation.cjs
          node scripts/smoke-updater.cjs

      - name: Full skill gate extras
        if: ${{ steps.scope.outputs.full == 'true' }}
        run: |
          node scripts/smoke-git-lazy.cjs
          node scripts/smoke-regression.cjs

      - name: Lean CI summary
        run: |
          echo "PR gate is impact-based. Historical benchmark and Windows installer are release-gate work, not per-commit work."
