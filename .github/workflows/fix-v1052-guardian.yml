name: Fix v1.0.52 Guardian

on:
  push:
    branches: [feature/v1.0.52]
    paths:
      - 'scripts/fix-v1052-guardian.cjs'
      - '.github/workflows/fix-v1052-guardian.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/v1.0.52
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/fix-v1052-guardian.cjs
      - name: Verify syntax and machine regression
        run: |
          node --check core/connection.js
          node --check main.js
          node --check scripts/smoke-machine-access.cjs
          node scripts/smoke-machine-access.cjs
      - name: Commit runtime hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add core/connection.js main.js scripts/smoke-machine-access.cjs
          git commit -m 'fix: make STOP ALL suspend MCP endpoint'
          git push origin HEAD:feature/v1.0.52
